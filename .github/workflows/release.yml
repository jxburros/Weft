name: Release
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
        - stable
        - preview
        default: stable
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
      app:
        description: Optional app ID; empty selects every advanced app
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/plan.yml@181636b602317ba703c3f4bf12775c34560f4efb
    with:
      toolkit-ref: 181636b602317ba703c3f4bf12775c34560f4efb
      channel: ${{ inputs.channel }}
      app: ${{ inputs.app }}
  verify:
    name: Release gate and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - name: Tag, versions and changelog agree
      id: meta
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          node scripts/release/metadata.js "$RELEASE_TAG" release-notes.md
        else
          node scripts/release/metadata.js
          echo "Dry run from $RELEASE_TAG; no release will be created." > release-notes.md
        fi
        echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
    - name: Install display and browser libraries
      run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
    - run: npm ci
    - name: Install pinned Electron before concurrent tests
      run: node node_modules/electron/install.js
    - run: npm run check
    - run: npm run test:docs
    - run: npm run evals
    - name: Supply-chain audit of shipped runtime dependencies
      run: npm audit --omit=dev --audit-level=high
    - name: Performance budgets
      run: npm run test:perf
    - name: Full suite with real Chromium
      run: xvfb-run -a npm test
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-notes
        path: release-notes.md
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['weft'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['weft'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['weft'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
  build:
    name: Package ${{ matrix.name }}
    needs:
    - plan
    - verify
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: windows-x64
          os: windows-latest
          builder: --win nsis --x64
          smoke: dist/win-unpacked/Weft.exe
          fuses: dist/win-unpacked/Weft.exe
          kind: nsis
        - name: macos
          os: macos-latest
          builder: --mac dmg zip --arm64 --x64
          smoke: dist/mac-arm64/Weft.app/Contents/MacOS/Weft
          fuses: dist/mac-arm64/Weft.app/Contents/MacOS/Weft dist/mac/Weft.app/Contents/MacOS/Weft
          kind: dmg
        - name: linux-x64
          os: ubuntu-latest
          builder: --linux AppImage deb --x64
          smoke: dist/Weft-${{ needs.verify.outputs.version }}-x86_64.AppImage
          fuses: dist/linux-unpacked/weft
          kind: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      WEFT_DISABLE_UPDATES: '1'
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['weft'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['weft'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - name: Decide signing from available secrets
      id: signing
      shell: bash
      env:
        AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        WEFT_WINDOWS_PUBLISHER: ${{ secrets.WEFT_WINDOWS_PUBLISHER }}
        WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      run: |
        signed=$(node scripts/release/signing.cjs "${{ matrix.name }}")
        echo "signed=$signed" >> "$GITHUB_OUTPUT"
        if [[ "$signed" == true ]]; then echo "${{ matrix.name }}: signed" > "signing-${{ matrix.name }}.txt"; else echo "${{ matrix.name }}: UNSIGNED (no signing credentials configured)" > "signing-${{ matrix.name }}.txt"; fi
        cat "signing-${{ matrix.name }}.txt"
    - name: Write App Store Connect API key
      if: matrix.name == 'macos' && steps.signing.outputs.signed == 'true'
      shell: bash
      env:
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: |
        key="$RUNNER_TEMP/AuthKey.p8"
        printf '%s' "$APPLE_API_KEY_P8" > "$key"
        echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
    - name: Build packages
      shell: bash
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        WEFT_WINDOWS_PUBLISHER: ${{ secrets.WEFT_WINDOWS_PUBLISHER }}
        WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CSC_LINK || '' }}
        CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' && 'true' || 'false' }}
      run: node scripts/release/build-packages.js ${{ matrix.builder }}
    - name: Verify update manifests and checksums
      shell: bash
      run: node scripts/release/verify-assets.js dist "${{ needs.verify.outputs.version }}"
    - name: Verify Electron fuses
      shell: bash
      run: for executable in ${{ matrix.fuses }}; do node scripts/release/check-fuses.js "$executable"; done
    - name: Verify Windows Authenticode signatures
      if: matrix.name == 'windows-x64' && steps.signing.outputs.signed == 'true'
      shell: pwsh
      run: |
        foreach ($file in @(Get-ChildItem dist/*.exe) + @(Get-Item dist/win-unpacked/Weft.exe)) {
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature status: $($signature.Status)" }
          Write-Host "$($file.Name): $($signature.SignerCertificate.Subject)"
        }
    - name: Verify macOS signature, notarization and Gatekeeper
      if: matrix.name == 'macos' && steps.signing.outputs.signed == 'true'
      shell: bash
      run: |
        for app in dist/mac*/Weft.app; do
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
        done
        for dmg in dist/*.dmg; do xcrun stapler validate "$dmg"; done
    - name: Smoke-test the packaged app
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == Linux ]]; then
          sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          xvfb-run -a node scripts/release/smoke-packaged.js "${{ matrix.smoke }}" ${{ matrix.kind }}
        else
          node scripts/release/smoke-packaged.js "${{ matrix.smoke }}" ${{ matrix.kind }}
        fi
    - name: Install, launch, reinstall and uninstall the Windows installer
      if: matrix.name == 'windows-x64'
      shell: pwsh
      run: |
        pwsh -NoProfile -File scripts/release/windows-install-check.ps1 "dist/Weft-Setup-${{ needs.verify.outputs.version }}-x64.exe" "${{ needs.verify.outputs.version }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Stage release assets
      shell: bash
      run: |
        shopt -s nullglob
        mkdir release-assets
        cp dist/*.exe dist/*.blockmap dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/latest*.yml "signing-${{ matrix.name }}.txt" release-assets/
        ls -l release-assets
        compgen -G 'release-assets/latest*.yml' > /dev/null || { echo "::error::No latest*.yml staged"; exit 1; }
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: weft-${{ matrix.name }}
        if-no-files-found: error
        retention-days: 14
        path: release-assets/
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['weft'].selected
    permissions:
      contents: read
  publish:
    name: Draft, verify and publish
    needs:
    - plan
    - verify
    - build
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['weft'].selected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ fromJSON(needs.plan.outputs.apps)['weft'].tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['weft'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['weft'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - name: Install verification dependencies only
      run: npm ci --ignore-scripts --omit=dev
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: weft-*
        path: release
        merge-multiple: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-notes
    - name: Verify manifests and write SHA256SUMS.txt
      run: node scripts/release/verify-assets.js release "$VERSION"
    - name: Sign checksums when a release key is configured
      env:
        RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
      shell: bash
      run: |
        if [[ -n "$RELEASE_GPG_KEY" ]]; then
          printf '%s' "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign --output release/SHA256SUMS.txt.asc release/SHA256SUMS.txt
        else
          echo "No RELEASE_GPG_KEY: SHA256SUMS.txt is not signed."
        fi
    - name: Compose release notes with signing status
      shell: bash
      run: |
        {
          cat release-notes.md
          echo
          echo "## Integrity and signing"
          echo
          sed 's/^/- /' release/signing-*.txt
          if grep -q '^windows-x64: UNSIGNED' release/signing-*.txt; then
            echo "- The Windows installer is not code-signed, so Microsoft Defender SmartScreen may show \"Windows protected your PC\". Check \`Weft-Setup-$VERSION-x64.exe\` against SHA256SUMS.txt (\`Get-FileHash -Algorithm SHA256\`), then choose **More info** > **Run anyway**."
          fi
          if grep -q '^macos: UNSIGNED' release/signing-*.txt; then
            echo "- The macOS app is not signed or notarized, so Gatekeeper refuses to open it on first launch (\"Apple could not verify Weft is free of malware\"). Check the \`.dmg\` or \`.zip\` against SHA256SUMS.txt (\`shasum -a 256\`), drag Weft to Applications and try to open it once, then open **System Settings** > **Privacy & Security** and choose **Open Anyway** (on macOS 14 and earlier you can instead Control-click Weft, choose **Open**, then **Open** again)."
          fi
          echo "- Every asset is listed in SHA256SUMS.txt$( [[ -f release/SHA256SUMS.txt.asc ]] && echo ' (GPG-signed: SHA256SUMS.txt.asc)')."
          echo "- In-app updates verify size and SHA-512 from latest*.yml and only accept stable releases from this repository."
        } > notes.md
        rm release/signing-*.txt
    - name: Preserve the observed signing status
      shell: bash
      run: sed -n '/^## Integrity and signing/,$p' notes.md > release/release-signing-status.md
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: JX-Holdings-LLC/release-infrastructure
        ref: 181636b602317ba703c3f4bf12775c34560f4efb
        path: .toolkit
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Stage the complete configured release inventory
      shell: bash
      env:
        RELEASE_APP: weft
      run: node .toolkit/src/release.mjs stage --app "$RELEASE_APP" --from release --bundle unified-bundle --sha
        "$RELEASE_SOURCE_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: bundle-weft
        path: unified-bundle
        if-no-files-found: error
  publish-weft:
    needs:
    - plan
    - publish
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['weft'].selected
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@181636b602317ba703c3f4bf12775c34560f4efb
    permissions:
      contents: write
    with:
      toolkit-ref: 181636b602317ba703c3f4bf12775c34560f4efb
      source-sha: ${{ needs.plan.outputs.sha }}
      app: weft
      security: standard
      artifact: bundle-weft
      dry-run: ${{ inputs.dry_run }}
