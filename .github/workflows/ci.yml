name: Weft checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install pinned Electron before concurrent tests
        run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm run test:unit
  chromium:
    name: Real Chromium and GUI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install display and browser libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - run: npm ci
      - name: Install pinned Electron before concurrent tests
        run: node node_modules/electron/install.js
      - name: Run real browser tests with a display
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          xvfb-run -a npm test 2>&1 | tee artifacts/chromium-tests.log
      - name: Compare reviewed visual fixtures
        run: WEFT_VISUAL=1 xvfb-run -a node --test test/visual.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-results-${{ github.sha }}
          path: |
            artifacts/
            test/visual/_failures/
          if-no-files-found: warn
          retention-days: 7
  package:
    name: Package and smoke-test (Linux, unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEFT_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install display and browser libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - run: npm ci
      - run: node scripts/release/metadata.js
      - run: npx electron-builder --config electron-builder.config.cjs --linux AppImage --x64 --publish never
      - name: Verify the update manifest and checksums
        run: node scripts/release/verify-assets.js dist "$(node -p 'require("./package.json").version')"
      - name: Launch the packaged AppImage
        run: xvfb-run -a node scripts/release/smoke-packaged.js "dist/Weft-$(node -p 'require("./package.json").version')-x86_64.AppImage" appimage
