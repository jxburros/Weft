name: Weft checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Synced disk writes are several times slower on Windows runners; per-test hang guards scale with this (test/time-budget.js).
      WEFT_TEST_TIME_SCALE: ${{ matrix.os == 'windows-latest' && '4' || '1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install pinned Electron before concurrent tests
        run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm run test:unit
      - name: Performance budgets
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:perf
  audit:
    name: Supply-chain audit of shipped dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The same gate as the release workflow: no high or critical advisory in runtime dependencies.
      - run: npm audit --omit=dev --audit-level=high
  chromium:
    name: Real Chromium and GUI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install display and browser libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - run: npm ci
      - name: Install pinned Electron before concurrent tests
        run: node node_modules/electron/install.js
      - name: Run real browser tests with a display
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          xvfb-run -a npm test 2>&1 | tee artifacts/chromium-tests.log
      - name: Compare reviewed visual fixtures
        run: WEFT_VISUAL=1 xvfb-run -a node --test test/visual.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chromium-results-${{ github.sha }}
          path: |
            artifacts/
            test/visual/_failures/
          if-no-files-found: warn
          retention-days: 7
  package:
    name: Package and smoke-test (Linux, unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEFT_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install display and browser libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - run: npm ci
      - run: node scripts/release/metadata.js
      - run: node scripts/release/build-packages.js --linux AppImage --x64
      - name: Verify Electron fuses
        run: node scripts/release/check-fuses.js dist/linux-unpacked/weft
      - name: Verify the update manifest and checksums
        run: node scripts/release/verify-assets.js dist "$(node -p 'require("./package.json").version')"
      - name: Launch the packaged AppImage
        run: xvfb-run -a node scripts/release/smoke-packaged.js "dist/Weft-$(node -p 'require("./package.json").version')-x86_64.AppImage" appimage
  macos-package:
    name: Package and smoke-test (macOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      WEFT_DISABLE_UPDATES: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Reproduce the missing-secret inputs from the release workflow.
      CSC_LINK: ''
      WIN_CSC_LINK: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/release/metadata.js
      - name: Build both macOS architectures
        run: node scripts/release/build-packages.js --mac dmg zip --arm64 --x64
      - name: Verify Electron fuses
        run: |
          node scripts/release/check-fuses.js dist/mac/Weft.app/Contents/MacOS/Weft
          node scripts/release/check-fuses.js dist/mac-arm64/Weft.app/Contents/MacOS/Weft
      - name: Verify update manifests and checksums
        run: node scripts/release/verify-assets.js dist "$(node -p 'require("./package.json").version')"
      - name: Launch the native packaged app
        shell: bash
        run: |
          app_dir=dist/mac
          if [[ "$(node -p 'process.arch')" == arm64 ]]; then app_dir=dist/mac-arm64; fi
          node scripts/release/smoke-packaged.js "$app_dir/Weft.app/Contents/MacOS/Weft" dmg
      # Informational: the x64 build under Rosetta 2 on the arm64 runner is not Intel hardware, and a
      # runner image without Rosetta cannot run it, so this launch does not gate the job.
      - name: Launch the x64 app under Rosetta (informational)
        if: runner.arch == 'ARM64'
        continue-on-error: true
        run: node scripts/release/smoke-packaged.js dist/mac/Weft.app/Contents/MacOS/Weft dmg
  windows-installer:
    name: Build, install and uninstall the Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WEFT_DISABLE_UPDATES: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/release/metadata.js
      - name: Build the NSIS installer
        run: node scripts/release/build-packages.js --win nsis --x64
      - name: Verify Electron fuses
        run: node scripts/release/check-fuses.js dist/win-unpacked/Weft.exe
      - name: Verify the update manifest and checksums
        shell: bash
        run: node scripts/release/verify-assets.js dist "$(node -p 'require("./package.json").version')"
      - name: Install, launch, reinstall and uninstall
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          pwsh -NoProfile -File scripts/release/windows-install-check.ps1 "dist/Weft-Setup-$version-x64.exe" $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weft-windows-installer-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Weft-Setup-*.exe
            dist/latest.yml
            dist/SHA256SUMS.txt
