<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Weft — Your work, woven together</title>
    <link rel="icon" href="../assets/logo/icons/favicon.ico" />
    <link rel="stylesheet" href="./gui.css" />
    <script type="module" src="./gui.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to workspace content</a>
    <div class="app" id="app">
      <nav class="workspace-rail" aria-label="Workspaces">
        <button class="brand-mark" id="home" title="Workspace overview" aria-label="Workspace overview">
          <img src="../assets/logo/svg/mark-full-color.svg" alt="" />
        </button>
        <div class="rail-line" aria-hidden="true"></div>
        <div id="workspace-buttons"></div>
        <button
          class="rail-button add-workspace"
          id="add-workspace"
          aria-label="Create workspace"
        >
          +
        </button>
        <div class="rail-bottom">
          <button
            class="rail-button"
            id="theme-toggle"
            aria-label="Toggle color theme"
          ></button
          ><button
            class="rail-button"
            id="settings-button"
            aria-label="Settings"
          ></button>
          <div class="user-avatar" title="Local profile" aria-hidden="true">You</div>
        </div>
      </nav>
      <aside class="workspace-sidebar" id="sidebar">
        <div class="wordmark">
          <img
            src="../assets/logo/svg/horizontal-full-color.svg"
            alt="Weft"
          /><span>YOUR PROJECT SPACE</span>
        </div>
        <button id="workspace-heading" class="workspace-heading" aria-haspopup="dialog">
          <span
            ><small>WORKSPACE</small
            ><strong id="workspace-name">My workspace</strong></span
          ><span aria-hidden="true">⌄</span>
        </button>
        <button id="search-button" class="search-button" aria-haspopup="dialog" aria-keyshortcuts="Control+K">
          <span class="search-icon" aria-hidden="true"></span><span>Find anything</span
          ><kbd aria-hidden="true">Ctrl K</kbd>
        </button>
        <nav id="sections" aria-label="Workspace sections"></nav>
        <div class="sidebar-divider" aria-hidden="true"></div>
        <div class="sidebar-label">
          <span id="open-tabs-label">OPEN TABS</span
          ><button
            id="new-tab"
            class="icon-button"
            aria-label="New tab"
            aria-keyshortcuts="Control+T"
            title="New tab · Ctrl T"
          >
            +
          </button>
        </div>
        <div id="tabs" role="group" aria-labelledby="open-tabs-label"></div>
        <div class="sidebar-bottom">
          <button id="downloads-button"></button
          ><button id="privacy-button"></button>
          <div class="local-note">
            <span class="status-dot" aria-hidden="true"></span>Saved on this device
          </div>
        </div>
      </aside>
      <div class="workspace-main">
        <header class="topbar">
          <button
            class="icon-button"
            id="toggle-sidebar"
            aria-controls="sidebar"
            aria-expanded="true"
            aria-label="Toggle sidebar"
          ></button>
          <div class="breadcrumb">
            <span id="breadcrumb-workspace">My workspace</span
            ><span class="crumb-slash" aria-hidden="true">/</span
            ><strong id="breadcrumb-section">Overview</strong>
          </div>
          <div class="topbar-actions">
            <button
              class="icon-button"
              id="command-button"
              aria-label="Command desk"
              title="Command desk"
            ></button
            ><button class="agent-toggle" id="agent-toggle" aria-controls="agent-panel" aria-expanded="false"></button>
          </div>
        </header>
        <form id="navigation" class="navigation" aria-label="Address and page controls">
          <button
            type="button"
            id="back"
            class="icon-button"
            aria-label="Back"
          ></button
          ><button
            type="button"
            id="forward"
            class="icon-button"
            aria-label="Forward"
          ></button
          ><button
            type="button"
            id="reload"
            class="icon-button"
            aria-label="Reload"
          ></button
          ><button
            type="button"
            id="stop"
            class="icon-button"
            aria-label="Stop loading"
          ></button>
          <div class="address-field">
            <button
              type="button"
              id="site-controls"
              aria-label="Site controls"
            ></button
            ><input
              id="address"
              role="combobox"
              aria-label="Website URL or search"
              aria-keyshortcuts="Control+L F6"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="omnibox-list"
              placeholder="Search the web or enter a URL"
              autocomplete="off"
              spellcheck="false"
            /><button type="button" id="zoom-indicator" class="zoom-indicator" hidden></button
            ><kbd aria-hidden="true">Ctrl L</kbd>
            <div id="omnibox-list" class="omnibox-list" role="listbox" aria-label="Address suggestions" hidden></div>
          </div>
          <button type="button" id="send-to-weft" hidden>Send to Weft</button>
          <span id="page-owner" class="owner-chip" hidden></span>
          <button type="button" id="focus-page" class="focus-page" aria-keyshortcuts="F6" hidden>Move focus into the page (F6)</button>
          <button
            type="button"
            id="save-page"
            class="icon-button"
            aria-label="Save page to workspace"
            title="Save page to workspace"
          ></button
          ><button
            type="button"
            id="split-view"
            class="icon-button"
            aria-label="Split view"
            title="Split view"
          ></button
          ><button
            type="button"
            id="page-more"
            class="icon-button"
            aria-label="Page tools"
          ></button>
        </form>
        <div id="find-bar" class="find-bar" role="search" aria-label="Find in page" hidden>
          <input id="find-input" type="text" aria-label="Find in page" placeholder="Find in page" autocomplete="off" spellcheck="false" />
          <span id="find-count" class="find-count"></span>
          <button type="button" id="find-previous" class="icon-button" aria-label="Previous match"></button
          ><button type="button" id="find-next" class="icon-button" aria-label="Next match"></button>
          <label class="inline-check"><input type="checkbox" id="find-case" /> Match case</label>
          <button type="button" id="find-close" class="icon-button" aria-label="Close find bar" aria-keyshortcuts="Escape"></button>
        </div>
        <section id="safety-notices" aria-label="Workspace safety notices" hidden></section>
        <div class="work-area">
          <main id="content" tabindex="-1"></main>
          <aside
            id="agent-panel"
            class="agent-panel"
            aria-label="Agent conversation"
            hidden
          ></aside>
        </div>
        <footer class="statusbar" aria-label="Status">
          <span id="status">Ready</span
          ><span id="ownership">You are in control</span
          ><span class="status-spacer"></span
          ><span id="item-count">Local workspace</span
          ><span class="status-dot" aria-hidden="true"></span>
        </footer>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" aria-atomic="true" hidden></div>
    <div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="alert-announcer" class="visually-hidden" role="alert" aria-atomic="true"></div>
    <section id="command-desk" hidden>
      <select id="command" aria-label="Command"></select>
      <p id="description"></p>
      <pre id="schema" tabindex="0" aria-label="Command input schema"></pre>
      <textarea id="arguments" aria-label="Command arguments (JSON)">{}</textarea
      ><button id="run">Run command</button>
      <div id="artifact"></div>
      <pre id="result" tabindex="0" aria-label="Command result"></pre>
    </section>
  </body>
</html>
