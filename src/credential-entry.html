<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Weft — save a sign-in</title>
    <link rel="stylesheet" href="./credential-entry.css" />
    <script src="./credential-entry-view.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title">Save a sign-in</h1>
      <p id="intro">Weft stores this in its encrypted credential vault. Agents never see it: they can only ask to sign in on the sites listed below, and you approve each use.</p>
      <dl>
        <dt>Credential</dt>
        <dd id="label"></dd>
        <dt>Only for</dt>
        <dd id="origins"></dd>
      </dl>
      <form id="entry" autocomplete="off">
        <div id="login-fields">
          <label>Username or email <input id="username" name="username" autocomplete="off" spellcheck="false" maxlength="512" /></label>
          <label>Password <input id="password" name="password" type="password" autocomplete="off" required maxlength="4096" /></label>
        </div>
        <div id="card-fields">
          <label>Card number <input id="number" name="number" inputmode="numeric" autocomplete="off" spellcheck="false" required maxlength="23" /></label>
          <label>Expiry (MM/YY) <input id="expiry" name="expiry" autocomplete="off" spellcheck="false" required maxlength="7" placeholder="MM/YY" /></label>
          <label>Security code <input id="cvc" name="cvc" type="password" inputmode="numeric" autocomplete="off" required maxlength="4" /></label>
          <label>Name on card (optional) <input id="cardholder" name="cardholder" autocomplete="off" spellcheck="false" maxlength="100" /></label>
          <p class="note" id="card-error" role="alert"></p>
        </div>
        <p class="note">Do not paste a password an agent or a web page asked you to enter here.</p>
        <div class="actions">
          <button type="button" id="cancel">Cancel</button>
          <button type="submit" class="primary" id="save">Save to vault</button>
        </div>
      </form>
    </main>
  </body>
</html>
